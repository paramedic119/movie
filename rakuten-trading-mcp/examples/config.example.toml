# rakuten-trading-mcp の設定例（全項目の説明）。
# 普段は `python -m rakuten_trading_mcp init` が作る config.toml を使い、必要な項目だけここから書き足す。
# 相対パスは設定ファイルのあるフォルダが基準。未知のキーはエラーになる（書き間違い防止）。

# "paper" = 模擬売買（既定） / "live" = 楽天証券に実際に発注
# live にするには、さらに環境変数 RAKUTEN_MCP_LIVE=yes が必要（誤って実弾で起動しないための二重確認）
mode = "paper"

# 発注前の人間の承認方式
#   "elicit" = サーバーが確認ダイアログ（MCP elicitation）を出し、承認された注文だけ発注する（推奨）。
#              ダイアログに対応していないクライアントでは発注できない（安全側に倒れる）。
#   "client" = サーバー側では確認しない（おまかせ）。Claude Code のツール実行許可に任せる。
#              無人のスケジュール実行もこちら。live で使うには [budget] の設定が必須。
approval_mode = "elicit"

# 監査ログ・模擬口座・発注ID などの保存先
data_dir = "data"

# preview_order で発行した確認トークンの有効期間（秒）
confirmation_ttl_seconds = 180

[risk]
trading_enabled = true
# data_dir にこの名前のファイルを置くと、消すまで新規発注をすべて止める（緊急停止）
kill_switch_file = "STOP"
# 売買してよい銘柄（空にすると全銘柄。おすすめしない）
allowed_symbols = ["7203", "6758", "9432", "8306"]
denied_symbols = []
lot_size = 100
allow_market_orders = false
max_order_value_jpy = 100000          # 1 注文の上限
max_daily_buy_value_jpy = 300000      # 1 日の買付合計の上限
max_position_value_jpy = 300000       # 1 銘柄の保有額の上限
max_daily_orders = 10
max_daily_cancels = 10                # 発注→取消の繰り返し（見せ玉と誤解される取引）を防ぐ
max_price_deviation_pct = 3.0         # 指値が現在値から何 % 離れてよいか（誤発注防止）
min_seconds_between_orders = 30
max_daily_loss_jpy = 30000            # その日の評価損がこれを超えたら新規の買いを止める（0 で無効）
enforce_market_hours = true
# 東証の休場日（土日と 12/31〜1/3 は自動で休場扱い）。毎年 JPX の休業日一覧を見て更新すること。
market_holidays = [
  "2026-01-12", "2026-02-11", "2026-02-23", "2026-03-20", "2026-04-29",
  "2026-05-04", "2026-05-05", "2026-05-06", "2026-07-20", "2026-08-11",
  "2026-09-21", "2026-09-22", "2026-09-23", "2026-10-12", "2026-11-03", "2026-11-23",
]

[budget]
# Claude に任せる運用予算。設定ファイルでしか変えられない（Claude が自分で増やすことはできない）。
# 対象は risk.allowed_symbols の銘柄だけ（予算を使うときは allowed_symbols の指定が必須）。
# 予算を始める前から持っている株はあなたの持ち分として扱い、Claude は売らない。
enabled = false
amount_jpy = 100000        # 保有株の取得原価 + 未約定の買い注文 の合計の上限
max_loss_jpy = 20000       # 予算全体の損失（確定 + 含み）がこれに達したら新規の買いを止める（0 で無効）
reinvest_profits = false   # true にすると、確定した利益の分だけ買える額が増える

[paper]
initial_cash_jpy = 1000000
# "static" = quotes.sample.json の値で模擬（どの OS でも動く。init コマンドがサンプルを置く）
# "rss"    = マーケットスピード II RSS の本物の株価で模擬売買（Windows のみ。本番前の確認に最適）
market_data = "static"
static_quotes_file = "quotes.sample.json"
commission_jpy = 0

[rss]
# RSS が接続されている Excel で開いておくブック（空のブックを保存して作る）
workbook = "mcp_bridge.xlsx"
symbol_suffix = ".T"
account_type = 0        # 口座区分（0: 特定 / 1: 一般 / 2: NISA …）。必ず公式ヘルプで確認すること
sor = 0                 # SOR区分（0: 通常 / 1: SOR）
blank_argument = "missing"
calc_timeout_seconds = 10
order_result_timeout_seconds = 15
first_order_id = 1
auto_setup_sheets = true
max_market_rows = 50

# RssMarket の取得項目名が公式と違う場合はここで上書き
# [rss.market_items]
# time = "現在値時刻"

# 一覧の列見出しが違う場合（check コマンドで確認）はここで上書き
# [rss.columns]
# quantity = ["保有数量"]
